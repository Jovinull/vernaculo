  notes: >-
    Critério de evidência deste pack: estudo acadêmico com corpus/fonte primária identificável ou
    dicionário de referência → attested para o tipo de ocorrência que a fonte documenta, com os
    limites descritos; na ausência disso, mesma descrição ou uso inequívoco em pelo menos duas
    fontes públicas independentes, uma delas local → corroborated (ADR-0018: só a partir de 0.5,
    renderizado à parte como não validado por revisão estruturada de falantes); fonte única,
    sentidos divergentes ou clichê midiático sem outra evidência → hypothesis (nunca renderizado).
    O pack descreve a variedade, sem pressupor caso de uso (ADR-0017): ajustes para um uso
    específico ficam na IA hospedeira ou numa persona de projeto com extends.
    Detalhes em RESEARCH.md.
