      title: Synthetic atlas (not a real work)
      url: https://example.org/synthetic-atlas
      citation: Synthetic citation used only for conformance tests.
      license: CC-BY-4.0
      usage: consulted
      accessed: "2026-09-29" # quoted: YAML 1.1 parsers would read an unquoted date as a timestamp
      notes: Fictitious source.
    - id: synthetic-review
      type: speaker-review
      title: Synthetic review round (not real)
      usage: cited
  notes: All provenance here is fictitious.
