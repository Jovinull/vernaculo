# A company's own persona file, kept in the company's repository.
# It inherits a persona from a persona root and adds the company's adjustments.
# The parent here is a SYNTHETIC FIXTURE; with a real pack you would extend,
# for example, pt-BR/ba/salvador once it exists and has been reviewed.
apiVersion: vernaculo.dev/v1alpha1
kind: Persona
extends: pt-BR/x-fixture/cidade-a
metadata:
  id: pt-BR/x-acme/cidade-a
  name: Concessionária Exemplo — Cidade A
  description: Fictional dealership's customer-service persona for locality A.
  language: pt-BR
  version: 1.0.0
  maturity: fixture
regionality:
  # Customer service: keep regional marking subtle.
  defaultIntensity: 0.2
linguistics:
  vocabulary:
    discouraged:
      # The company prefers not to use this (synthetic) form with customers.
      - term: termo-sintético-comum
        reason: Company style guide.
